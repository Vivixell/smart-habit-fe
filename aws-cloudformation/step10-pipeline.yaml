AWSTemplateFormatVersion: "2010-09-09"
Description: Cross-account CodePipeline for ECS Blue/Green deployment

Parameters:
  GitHubConnectionArn:
    Type: String
    Description: CodeStar Connections ARN for the GitHub App connection
  ArtifactBucketName:
    Type: String
    Default: cicd-artifacts-tooling-704601633620
  KMSKeyArn:
    Type: String
    Default: arn:aws:kms:us-east-1:704601633620:key/bbaebe14-404c-4a70-96bb-2901f7731950
  PipelineServiceRoleArn:
    Type: String
    Default: arn:aws:iam::704601633620:role/CodePipelineServiceRole
  CrossAccountDeploymentRoleArn:
    Type: String
    Default: arn:aws:iam::122452779326:role/CrossAccountDeploymentRole

Resources:
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: cicd-app-pipeline
      RoleArn: !Ref PipelineServiceRoleArn
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
        EncryptionKey:
          Id: !Ref KMSKeyArn
          Type: KMS
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: Vivixell/smart-habit-fe
                BranchName: master
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: "true"
              OutputArtifacts:
                - Name: SourceArtifact

        - Name: Build
          Actions:
            - Name: CodeBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: cicd-app-build
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact

        - Name: Deploy
          Actions:
            - Name: ECSBlueGreenDeployment
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              RoleArn: !Ref CrossAccountDeploymentRoleArn
              Configuration:
                ApplicationName: cicd-app
                DeploymentGroupName: cicd-app-dg
                TaskDefinitionTemplateArtifact: BuildArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: BuildArtifact
                AppSpecTemplatePath: appspec.yml
                Image1ArtifactName: BuildArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: BuildArtifact

Outputs:
  PipelineName:
    Value: !Ref Pipeline
