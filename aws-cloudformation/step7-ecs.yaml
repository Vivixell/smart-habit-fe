AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate cluster, task definition (placeholder image), and service

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cicd-workload-cluster

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsTaskExecutionRole-cicd
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cicd-app-task
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: cicd-app-container
          Image: public.ecr.aws/nginx/nginx:latest
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/cicd-app
              awslogs-region: us-east-1
              awslogs-stream-prefix: ecs
              awslogs-create-group: "true"

  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: cicd-app-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - subnet-0f61c4049e526e369
            - subnet-00cbefd16ac70203a
          SecurityGroups:
            - sg-0f2f4f053b559c17c
      LoadBalancers:
        - ContainerName: cicd-app-container
          ContainerPort: 80
          TargetGroupArn: arn:aws:elasticloadbalancing:us-east-1:122452779326:targetgroup/cicd-tg-blue/fe10337db33c38f4

Outputs:
  ClusterName:
    Value: !Ref ECSCluster
  ServiceName:
    Value: !GetAtt ECSService.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinition

